# aicor-imports.yaml — every OUTWARD edge from the lab-automation-twin module into the frozen upstream.
# Three categories (VRB convention): grounds | divergence (register tag in DEFERRED-REGISTER.md) | out-of-scope (named reason).
# Generated by package_okf.py from src/tbox.py; checked by tools/check_aicor_imports.py.

aicor_repo: auto (../aicor -> ResearchSpace foundation/okf/aicor, frozen)
upstream_l2:
- foundation/okf/aicor (frozen hub)
- verticals/robot-scientist/okf (frozen)
- foundation/okf/vrb (lab-automation-device, frozen)
- foundation/okf/normative-admissibility (frozen)
note: 'Grounding is declared at L2: each concept names the upstream L2 classes it specialises (checked against the
  compiled upstream union), because two of the upstreams are verticals.'
