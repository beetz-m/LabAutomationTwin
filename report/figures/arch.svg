    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d2630" x="22.89096" y="36.921051" transform="rotate(-0 22.89096 36.921051)">Knowledge base</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(22.89096 51.148769)">planner facts (ABox → ASP)</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(22.89096 61.088769)">Cell 01 component records</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(22.89096 71.028769)">registries: categories,</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(22.89096 81.294371)">constraints, norms, devices</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d2630" x="167.41296" y="36.921051" transform="rotate(-0 167.41296 36.921051)">Plan library</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 51.148769)">generalized plans per</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 61.088769)">category; build sub-plans</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 71.028769)">at perform time; no device</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 81.238902)">names (linted)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d2630" x="311.93496" y="36.921051" transform="rotate(-0 311.93496 36.921051)">Lab designator language</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(311.93496 51.148769)">culture plan, lab plan,</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(311.93496 61.088769)">contracts, process models,</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(311.93496 71.028769)">epistemic meta model, KPIs</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d2630" x="167.41296" y="131.526728" transform="rotate(-0 167.41296 131.526728)">Executive</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 145.754447)">lifecycle, projection,</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 155.694447)">understanding gate,</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(167.41296 165.634447)">policies, failure handling</text>
   </g>
