   </g>
   <g id="text_14">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(19.9224 198.089156)">111 Giskard motion statecharts over 25 goal frames;</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(19.9224 208.716969)">monitors make soft constraints hold-or-cancel</text>
   </g>
