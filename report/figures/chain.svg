   </g>
   <g id="text_18">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(19.9224 252.584156)">symbolic backend (12 scenarios) and Isaac Sim physics (3 runs);</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(19.9224 262.524156)">hash-chained audit trail per run</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2c8540" x="281.736" y="25.215562" transform="rotate(-0 281.736 25.215562)">Refinement proof</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 37.015656)">z3 and exhaustive checks;</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 47.307125)">under assumptions A1–A6</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 57.947125)">every execution realizes</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 68.587125)">the culture plan, or stops</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 79.963375)">in a handler whose</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 89.867125)">guarantee holds</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 98.41)"/>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 111.147125)">8 negative controls</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1d2630" transform="translate(281.736 121.787125)">caught</text>
   </g>
