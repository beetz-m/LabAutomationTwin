   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(19.9224 34.604156)">12 actions on 3 cultures; physical and knowledge effects;</text>
    <text style="font-size: 7.1px; font-family: 'DejaVu Sans'; fill: #5c6873" transform="translate(19.9224 44.544156)">goal: expected information gain ≥ 0.5 bit</text>
